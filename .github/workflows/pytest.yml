name: Run pytest

on: 
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Run pytest
    runs-on: ubuntu-latest
    env:
      PROJECT_ROOT: ${{ github.workspace }}/waveform-controller
    environment: hasher
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SAFEHR_READ_ONLY_WORKER_ID }}
          private-key: ${{ secrets.SAFEHR_READ_ONLY_WORKER_KEY }}
          repositories: waveform-private-queries
      - uses: actions/checkout@v5
        with:
          path: waveform-controller
      - name: Checkout PIXL dependency
        uses: actions/checkout@v5
        with:
          repository: SAFEHR-data/PIXL
          ref: e29f4b15c3b9d21c9a6e08c272aca7773311b32c  # pragma: allowlist secret
          path: PIXL
      - name: Checkout private SQL scripts
        uses: actions/checkout@v5
        with:
          repository: SAFEHR-data/waveform-private-queries
          token: ${{ steps.generate-token.outputs.token }}
          ref: 0345bb6e3ed51b05e46982434911c9138c84a035  # pragma: allowlist secret
          path: waveform-private-queries

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: true

      - name: Make a venv
        working-directory: waveform-controller
        run: uv venv

      - name: Install with dependencies
        working-directory: waveform-controller
        # Editable so imports resolve under src/ and coverage's source=["src"] sees them.
        run: uv pip install -e '.[dev]'

      - name: Prepare config env files for compose
        working-directory: waveform-controller
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_KEY_VAULT_NAME: ${{ secrets.AZURE_KEY_VAULT_NAME }}
          AZURE_KEY_VAULT_SECRET_NAME: ${{ vars.AZURE_KEY_VAULT_SECRET_NAME }}
        run: |
          mkdir -p ../config
          cp config.EXAMPLE/exporter.env.EXAMPLE ../config/exporter.env
          cp config.EXAMPLE/hasher.env.EXAMPLE ../config/hasher.env
          cp config.EXAMPLE/controller.env.EXAMPLE ../config/controller.env
          cp config.EXAMPLE/monitoring.env.EXAMPLE ../config/monitoring.env
          cp config.EXAMPLE/janitoring.env.EXAMPLE ../config/janitoring.env
          # (lgtm is not involved in this test so its config file is not copied)
          {
            echo ""
            echo "AZURE_CLIENT_ID=${AZURE_CLIENT_ID}"
            echo "AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET}"
            echo "AZURE_TENANT_ID=${AZURE_TENANT_ID}"
            echo "AZURE_KEY_VAULT_NAME=${AZURE_KEY_VAULT_NAME}"
            echo "AZURE_KEY_VAULT_SECRET_NAME=${AZURE_KEY_VAULT_SECRET_NAME}"
          } >> ../config/hasher.env
          
          # install private SQL scripts
          cp ../waveform-private-queries/src/sql/*.sql src/sql/private/
          # exporter config can't be done here because test_snakemake_integration.py wires in its own config file

      - name: Run the tests
        working-directory: waveform-controller
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # Run inside our repo, not the workspace root that holds both repos,
          # so uploaded paths are repo-relative (src/...) and match the files on GitHub.
          working-directory: waveform-controller
          # Dual checkout (this repo + PIXL) confuses slug detection; pin explicitly.
          slug: SAFEHR-data/waveform-controller
          files: coverage.xml
          fail_ci_if_error: true
